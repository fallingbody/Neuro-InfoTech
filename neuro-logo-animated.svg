<svg viewBox="0 0 100 100" width="500" height="500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
  </defs>
  <g transform="translate(50, 50)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite" />
      <circle cx="0" cy="-14" r="16" fill="none" stroke="url(#brand-grad)" stroke-width="7" />
      <circle cx="-12" cy="7" r="16" fill="none" stroke="url(#brand-grad)" stroke-width="7" />
      <circle cx="12" cy="7" r="16" fill="none" stroke="url(#brand-grad)" stroke-width="7" />
      <circle cx="0" cy="0" r="4" fill="url(#brand-grad)" />
    </g>
  </g>
</svg>
